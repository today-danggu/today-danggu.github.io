name = "danggu-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 서버 주소: https://api.ohsangplay.com/danggu (오상플레이 공용 API 도메인을 앱마다 경로로 나눠 쓴다)
# Cloudflare DNS의 api.ohsangplay.com 레코드(야추가 이미 씀)를 같이 쓴다. /danggu는 src/routing.ts가 떼고 처리한다.
routes = [
  { pattern = "api.ohsangplay.com/danggu/*", zone_name = "ohsangplay.com" },
]
workers_dev = true

# 온라인 같이하기: 방 하나당 Durable Object 하나 (무료 플랜은 SQLite 기반 클래스 사용)
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "DangguRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DangguRoom"]

[vars]
# 서버를 쓸 수 있는 웹 주소. https://localhost(안드로이드 앱), capacitor://localhost(iOS 앱)
ALLOWED_ORIGINS = "https://danggu.ohsangplay.com,https://today-danggu.github.io,http://localhost,http://127.0.0.1,https://localhost,capacitor://localhost"
